pt":"PRESUME - Most nearly means?","choices":{"A":"Assume","B":"Doubt","C":"Claim","D":"Suggest"},"correct":"A"},{"n":3,"prompt":"PREVALENT - Most nearly means?","choices":{"A":"Rare","B":"Widespread","C":"Hidden","D":"Occasional"},"correct":"B"},{"n":4,"prompt":"PROLONG - Most nearly means?","choices":{"A":"Shorten","B":"Repeat","C":"Extend","D":"Cancel"},"correct":"C"},{"n":5,"prompt":"The recruiter was PROMPT for every appointment:","choices":{"A":"Late","B":"Punctual","C":"Careless","D":"Reluctant"},"correct":"B"},{"n":6,"prompt":"PROSPER - Most nearly means?","choices":{"A":"Decline","B":"Thrive","C":"Expand","D":"Survive"},"correct":"B"},{"n":7,"prompt":"PROVOKE - Most nearly means?","choices":{"A":"Calm","B":"Challenge","C":"Incite","D":"Ignore"},"correct":"C"},{"n":8,"prompt":"PRUDENT - Most nearly means?","choices":{"A":"Reckless","B":"Modest","C":"Patient","D":"Sensible"},"correct":"D"},{"n":9,"prompt":"QUELL - Most nearly means?","choices":{"A":"Repair","B":"Ignite","C":"Suppress","D":"Confront"},"correct":"C"},{"n":10,"prompt":"RANCID - Most nearly means?","choices":{"A":"Spoiled","B":"Fresh","C":"Sweet","D":"Fragrant"},"correct":"A"},{"n":11,"prompt":"The inspector's questions seemed RANDOM to the nervous recruits:","choices":{"A":"Repetitive","B":"Organized","C":"Haphazard","D":"Personal"},"correct":"C"},{"n":12,"prompt":"RATIFY - Most nearly means?","choices":{"A":"Approve","B":"Reject","C":"Delay","D":"Draft"},"correct":"A"},{"n":13,"prompt":"REBUKE - Most nearly means?","choices":{"A":"Praise","B":"Scold","C":"Ignore","D":"Question"},"correct":"B"},{"n":14,"prompt":"RECKLESS - Most nearly means?","choices":{"A":"Cautious","B":"Confident","C":"Careless","D":"Gentle"},"correct":"C"},{"n":15,"prompt":"RECTIFY - Most nearly means?","choices":{"A":"Worsen","B":"Deny","C":"Correct","D":"Replace"},"correct":"C"},{"n":16,"prompt":"REFUGE - Most nearly means?","choices":{"A":"Danger","B":"Shelter","C":"Obstacle","D":"Journey"},"correct":"B"},{"n":17,"prompt":"REFUTE - Most nearly means?","choices":{"A":"Confirm","B":"Question","C":"Repeat","D":"Disprove"},"correct":"D"},{"n":18,"prompt":"The private's RELUCTANT tone suggested he doubted the plan:","choices":{"A":"Eager","B":"Nervous","C":"Doubtful","D":"Unwilling"},"correct":"D"}]},{"code":"AR","title":"PART II - (AR) ARITHMETIC REASONING","minutes":14,"instructions":"This test has 15 questions designed to test your ability to solve Arithmetic Problems. Use your scratch paper for any figuring you need to do. ANSWER ALL (15) QUESTIONS IF ABLE!","questions":[{"n":1,"prompt":"Out of 25 qualification attempts on the rifle range, a soldier hit the target 20 times.\n\nWhat percent of the attempts were successful?","choices":{"A":"80%","B":"20%","C":"400%","D":"8%"},"correct":"A"},{"n":2,"prompt":"A soldier earns $16.00 per hour with time-and-a-half paid for any hours worked beyond 8 in one day. One day the soldier worked 11 hours.\n\nHow much did the soldier earn that day?","choices":{"A":"$264.00","B":"$240.00","C":"$200.00","D":"$176.00"},"correct":"C"},{"n":3,"prompt":"A supply clerk mixes 20 pounds of coffee worth $2.40 per pound with 5 pounds of coffee worth $7.40 per pound.\n\nAt what price per pound should the mixture be sold to reflect the same total value?","choices":{"A":"$3.40","B":"$6.40","C":"$42.50","D":"$4.90"},"correct":"A"},{"n":4,"prompt":"Diego's weekly pay was increased from $320.00 to $364.00.\n\nWhat was the increase in pay, to the nearest percent?","choices":{"A":"12%","B":"1%","C":"114%","D":"14%"},"correct":"D"},{"n":5,"prompt":"A square parade field measures 12 feet on a side. If each side of the square is increased by 4 feet, how many square feet are added to the area?","choices":{"A":"256 square feet","B":"16 square feet","C":"112 square feet","D":"96 square feet"},"correct":"C"},{"n":6,"prompt":"A scale drawing of a motor pool has a scale of 1 inch to 25 feet.\n\nHow many inches on the drawing represent an actual distance of 275 feet?","choices":{"A":"11 inches","B":"110 inches","C":"1.10 inches","D":"6,875 inches"},"correct":"A"},{"n":7,"prompt":"In a certain city, a rideshare fare is $4.00 for the first mile, and $0.40 for each additional mile.\n\nHow far, in miles, can a passenger travel for $13.60?","choices":{"A":"34 miles","B":"25 miles","C":"24 miles","D":"3.09 miles"},"correct":"B"},{"n":8,"prompt":"The perimeter of a rectangular motor pool bay is 50 feet. If the length is 17 feet, 6 inches, what is the width of the bay?","choices":{"A":"8 feet, 0 inches","B":"7 feet, 6 inches","C":"2 feet, 0 inches","D":"32 feet, 6 inches"},"correct":"B"},{"n":9,"prompt":"In a supply room, 4 clerks each earn $540.00; 2 clerks each earn $660.00.\n\nWhat is the average weekly pay for these 6 workers?","choices":{"A":"$1,740.00","B":"$580.00","C":"$600.00","D":"$696.00"},"correct":"B"},{"n":10,"prompt":"A commuter train traveled 255 miles in 3 hours and 24 minutes.\n\nWhat was the average rate of speed, in miles per hour, for the trip?","choices":{"A":"9 miles per hour","B":"867 miles per hour","C":"75 miles per hour","D":"85 miles per hour"},"correct":"C"},{"n":11,"prompt":"The wholesale list price of a tactical flashlight is $40.00. A supply sergeant buys a shipment at a discount of 20 percent and sells them at 10 percent above the wholesale list price.\n\nWhat was the profit on each item?","choices":{"A":"$44.00","B":"$4.00","C":"$8.00","D":"$12.00"},"correct":"D"},{"n":12,"prompt":"A soldier's bank balance was $4,520.00. Her next four transactions were as follows:\n\n-$680.00, -$95.00, +$940.00, +$310.00\n\nWhat was her bank balance after the fourth transaction had posted?","choices":{"A":"$6,545.00","B":"$4,995.00","C":"$4,045.00","D":"$4,685.00"},"correct":"B"},{"n":13,"prompt":"A courier leaves a forward operating base driving at an average rate of 28 miles per hour but forgets part of the cargo manifest. 2 hours later, a second courier is dispatched with the missing paperwork and is instructed to overtake the first courier in 4 more hours.\n\nHow fast must the second courier travel?","choices":{"A":"168 miles per hour","B":"14 miles per hour","C":"42 miles per hour","D":"28 miles per hour"},"correct":"C"},{"n":14,"prompt":"An NCOIC and a junior soldier spent several days repainting the barracks. The ratio of the NCOIC's pay to the junior soldier's pay was 3:1. If the two were paid $640.00 total for the job, how much did the NCOIC receive?","choices":{"A":"$1,920.00","B":"$160.00","C":"$480.00","D":"$320.00"},"correct":"C"},{"n":15,"prompt":"A mess hall sold 9 gallons of milk at 45 cents a pint.\n\nHow much did the mess hall receive for the milk?","choices":{"A":"$32.40","B":"$3,240.00","C":"$4.05","D":"$16.20"},"correct":"A"}]},{"code":"PC","title":"PART III - (PC) PARAGRAPH COMPREHENSION","minutes":7,"instructions":"This test has 8 questions designed to test your ability to understand what you have read. Read the paragraph and select one of the four lettered choices which best completes the statement or answers the question. ANSWER ALL (8) QUESTIONS IF ABLE!","questions":[{"n":1,"prompt":"Most smoke detectors include a test button that lets a resident check whether the alarm's electronics and speaker are working without needing to create actual smoke. Pressing the button triggers the alarm sound the same way smoke would, confirming the circuitry functions and the battery has enough power to sound the alert. Fire safety experts recommend testing detectors monthly this way, because a detector's sensor can fail silently over time even while the unit otherwise looks normal, and battery-powered units eventually run low no matter how new the detector appears.\n\nAccording to the passage, why do fire safety experts recommend regularly using a smoke detector's test button?","choices":{"A":"It replaces the need to ever change the battery","B":"A detector's sensor or battery can fail without any visible sign","C":"It clears smoke that has built up inside the unit","D":"It is only necessary when the detector is brand new"},"correct":"B"},{"n":2,"prompt":"Public libraries set due dates on borrowed books so that materials in demand can circulate to other patrons rather than staying with one borrower indefinitely. Many libraries allow a book to be renewed online before the due date if no one else has placed a hold on it, extending the borrowing period without a trip back to the building. If a hold has been placed by another patron, however, the system usually blocks the renewal, since letting one borrower keep extending the loan would leave the waiting patron without access to the book.\n\nIt can be inferred from the passage that a library blocks a renewal mainly when...","choices":{"A":"the book is more than a year overdue","B":"another patron has placed a hold on that book","C":"the borrower has never renewed a book before","D":"the library is closed for a holiday"},"correct":"B"},{"n":3,"prompt":"Nutrition guidelines commonly recommend picturing a meal as a plate divided into sections rather than counting every calorie. Roughly half the plate is filled with vegetables and fruit, about a quarter with a protein source such as meat, beans, or fish, and the remaining quarter with a grain such as rice, pasta, or bread. This visual method is meant to make balanced eating easier to plan without needing detailed nutritional information for every food, since the proportions alone tend to keep a typical meal within a reasonable range of nutrients.\n\nThe main idea of this passage is that the plate method is designed to...","choices":{"A":"eliminate the need to eat any grains","B":"make balanced eating simpler without detailed calorie counting","C":"require weighing every ingredient before a meal","D":"replace vegetables entirely with protein"},"correct":"B"},{"n":4,"prompt":"The First Transcontinental Railroad, completed in 1869, linked the existing eastern rail network to California by joining two lines built from opposite directions. The Central Pacific Railroad laid track eastward from Sacramento, while the Union Pacific Railroad laid track westward from Nebraska, and the two met at Promontory Summit in Utah, where a ceremonial final spike was driven. Before its completion, a trip across the country by wagon could take months; afterward, the same journey by rail could be made in about a week.\n\nAccording to the passage, where did the two railroad companies' tracks meet?","choices":{"A":"Sacramento, California","B":"Promontory Summit, Utah","C":"Omaha, Nebraska","D":"Somewhere along the Mississippi River"},"correct":"B"},{"n":5,"prompt":"Perishable foods such as raw meat, dairy, and cut produce should be kept at or below 40 degrees Fahrenheit to slow the growth of bacteria that cause spoilage and foodborne illness. Between 40 and 140 degrees, often called the \"danger zone,\" bacteria can multiply rapidly, so perishable food left out at room temperature should not sit for more than about two hours before being refrigerated or discarded. On a hot day, that safe window shrinks to about one hour, since warmer air temperatures speed up bacterial growth even further.\n\nAccording to the passage, how does a hot day affect the safe time perishable food can sit out?","choices":{"A":"It has no effect on the safe time window","B":"It extends the safe window to four hours","C":"It shortens the safe window to about one hour","D":"It only affects dairy products, not meat"},"correct":"C"},{"n":6,"prompt":"At many public pools, lifeguards rotate between different watch positions every twenty to thirty minutes rather than staying at one station for an entire shift. Continuously scanning a crowded pool for signs of trouble is mentally demanding, and attention naturally drifts after sustained focus on the same area. By rotating positions regularly, pools keep each lifeguard's attention sharper than it would be if a single guard watched the same water for hours without a break, reducing the chance that a struggling swimmer goes unnoticed.\n\nIt can be inferred from the passage that rotating lifeguard positions is intended mainly to...","choices":{"A":"give lifeguards a chance to socialize with each other","B":"keep each lifeguard's attention sharp and reduce missed emergencies","C":"train new lifeguards on every part of the pool","D":"reduce the total number of lifeguards needed per shift"},"correct":"B"},{"n":7,"prompt":"A pulley changes the amount of force needed to lift a load by redirecting or dividing the effort across one or more rope segments. A single fixed pulley mainly changes the direction of the pulling force, making it easier to pull down on a rope rather than lift straight up, without reducing how hard a person must pull. Adding a second, movable pulley to the system divides the load's weight across two rope segments, so the person pulling only has to exert about half the force, though they must pull the rope twice as far to raise the load the same distance.\n\nAccording to the passage, what is the main advantage of adding a movable pulley to a single fixed pulley?","choices":{"A":"It eliminates the need to pull any rope at all","B":"It reduces the force needed to lift the load, at the cost of pulling farther","C":"It doubles the force needed but shortens the pulling distance","D":"It only changes the direction of the pull, not the force required"},"correct":"B"},{"n":8,"prompt":"Before the late 1800s, most towns in the United States set their clocks according to local solar noon, meaning the exact time could differ from one town to the next even a short distance apart. This created serious scheduling problems for railroads, which needed a consistent way to coordinate train departures and arrivals across long distances. In 1883, American and Canadian railroads adopted a system of standardized time zones to solve this problem, and the change was so practical that towns across the country soon adjusted their public clocks to match, even before the government formally adopted the system into law years later.\n\nAccording to the passage, what problem led railroads to adopt standardized time zones?","choices":{"A":"Local solar noon time made it hard to coordinate train schedules across distances","B":"The government required railroads to change their schedules","C":"Passengers complained about ticket prices","D":"Trains could not run safely at night without standardized time"},"correct":"A"}]},{"code":"MK","title":"PART IV - (MK) MATHEMATICS KNOWLEDGE","minutes":12,"instructions":"This test has 13 questions all regarding Mathematical Knowledge. You are to decide which of the four possible answers is correct for the problem or formula it is associated with. ANSWER ALL (13) QUESTIONS IF ABLE!","questions":[{"n":1,"prompt":"A shipping company packs small boxes measuring 2 inches by 3 inches by 5 inches inside large boxes measuring 4 inches by 9 inches by 15 inches.\n\nHow many of the small boxes are required to fill one large box?","choices":{"A":"9","B":"15","C":"18","D":"20"},"correct":"C"},{"n":2,"prompt":"A wheel has a diameter of 21 inches. How many inches will the wheel roll along the ground during one rotation? (Use 22/7 as the value of π.)","choices":{"A":"66 inches","B":"33 inches","C":"21 inches","D":"42 inches"},"correct":"A"},{"n":3,"prompt":"A student has grades of 70 on each of two tests and a grade of 80 on a third test.\n\nWhat grade must he get on a fourth test to raise his average to 78?","choices":{"A":"14","B":"82","C":"92","D":"102"},"correct":"C"},{"n":4,"prompt":"A motorist travels for 2 hours at 60 miles per hour and then travels for 4 more hours at 45 miles per hour.\n\nWhat is her average rate of speed in miles per hour for the entire trip?","choices":{"A":"52.5 miles per hour","B":"49 miles per hour","C":"50 miles per hour","D":"105 miles per hour"},"correct":"C"},{"n":5,"prompt":"A sprinkler is capable of watering a circular area up to a radius of 12 feet. If it is used to cover a 90-degree angular portion of this a <script>
(function () {
  "use strict";

  var app = document.getElementById("app");
  var TEST_VARIANTS = null; // array of {sections: [...]} -- one per test number
  var QUESTIONS = null;     // the currently-selected variant; reassigned when Start Test is clicked
  var SCORING = null;       // shared across all variants -- same norm tables regardless of content

  var RECRUITERS = ["Curless SSG", "Gatling SFC", "Guiler SFC", "Recendez SFC", "Schultz SFC", "Shirley SFC"];

  // Presets for the optional recruiter next-action note on the final STOP
  // screen. Adjust the wording to match actual station workflow whenever.
  var NEXT_ACTION_OPTIONS = [
    "Schedule retest",
    "Refer to recruiter for enlistment counseling",
    "Needs additional study before retesting",
    "Meets standards — proceeding with processing",
    "No further action needed",
    "Other (specify below)"
  ];
  var NEXT_ACTION_OTHER = "Other (specify below)";

  var SCORES_ACCESS_LAST = "check";
  var SCORES_ACCESS_FIRST = "scores";

  // Google Apps Script web app (/exec URL) that appends each result to a
  // Sheet -- see apps-script/results-webhook.gs for the backend and setup
  // steps. Best-effort sync on top of the local cookie history, which stays
  // the durable record if this is empty or the device is offline.
  var RESULTS_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxUnnKIWbxf7x1f4lFQsAueF041-JB8_M5KrPqyvMx3jBrhXf1aWiEANbKT-IUJD1sf/exec";

  // March2Success's free study site does not support bulk/roster account
  // creation (confirmed against their registration page) -- every account,
  // including this recruiter's own, is created one at a time through their
  // form. This referral link pre-tags the recruiter (mID param) so a
  // student who registers through it is automatically associated with this
  // station without having to know or type a station ID.
  var M2S_SIGNUP_URL = "https://march2success.com/register?params=mID164667516%7CShirley";

  // Keyboard shortcuts on the question screen only: A-D/1-4 pick an answer,
  // Enter advances. Exactly one handler is ever attached -- each screen
  // render swaps it out (or clears it) so key presses never leak to a
  // screen they weren't meant for.
  var activeKeyHandler = null;
  function setKeyHandler(fn) {
    if (activeKeyHandler) document.removeEventListener("keydown", activeKeyHandler);
    activeKeyHandler = fn;
    if (fn) document.addEventListener("keydown", fn);
  }

  // Auto-reset to the Start screen after 30 minutes of inactivity, but only
  // once results are already in (the final STOP screen and Results screen)
  // -- never mid-test, since a mid-test reset would silently discard a
  // test-taker's in-progress answers. This is a kiosk left unattended after
  // a completed test, not a distraction-mid-question guard (the per-section
  // timer already forces progress there).
  var IDLE_TIMEOUT_MS = 30 * 60 * 1000;
  var idleTimeoutHandle = null;
  var idleTimeoutArmed = false;

  function resetIdleTimeout() {
    if (idleTimeoutHandle) clearTimeout(idleTimeoutHandle);
    idleTimeoutHandle = setTimeout(function () { renderStart(); }, IDLE_TIMEOUT_MS);
  }

  function armIdleTimeout() {
    if (!idleTimeoutArmed) {
      idleTimeoutArmed = true;
      document.addEventListener("click", resetIdleTimeout);
      document.addEventListener("touchstart", resetIdleTimeout);
      document.addEventListener("keydown", resetIdleTimeout);
    }
    resetIdleTimeout();
  }

  function disarmIdleTimeout() {
    if (idleTimeoutHandle) { clearTimeout(idleTimeoutHandle); idleTimeoutHandle = null; }
    if (idleTimeoutArmed) {
      idleTimeoutArmed = false;
      document.removeEventListener("click", resetIdleTimeout);
      document.removeEventListener("touchstart", resetIdleTimeout);
      document.removeEventListener("keydown", resetIdleTimeout);
    }
  }

  var state = {
    lastName: "",
    firstName: "",
    phone: "",
    recruiter: "",
    testNumber: 1,
    sectionIndex: 0,  // index into QUESTIONS.sections
    questionIndex: 0, // index into the current section's questions
    answers: {},      // answers[sectionCode][n] = "A"/"B"/"C"/"D"
    timerHandle: null,
    secondsLeft: 0,
    finalResults: null, // set once the last section ends; see renderStop/renderResults
    finalPayload: null  // buildResultPayload(finalResults), sent to the webhook and reused by renderResults
  };

  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === "class") e.className = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) {
      if (typeof c === "string") e.appendChild(document.createTextNode(c));
      else if (c) e.appendChild(c);
    });
    return e;
  }

  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

  function fmtTime(sec) {
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  // "PART I - (WK) WORD KNOWLEDGE" -> { part: "PART I", name: "Word Knowledge" }
  function parseSectionTitle(title) {
    var m = title.match(/^(PART [IVX]+) - \([A-Z]+\)\s*(.+)$/);
    if (!m) return { part: title, name: title };
    var name = m[2].replace(/\S+/g, function (w) {
      return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
    });
    return { part: m[1], name: name };
  }

  // "Word Knowledge" -> fragment with the leading letter of each word bolded,
  // so the section's acronym (e.g. WK) reads visually without spelling it out.
  function boldedName(name) {
    var frag = document.createDocumentFragment();
    name.split(" ").forEach(function (word, i) {
      if (i > 0) frag.appendChild(document.createTextNode(" "));
      frag.appendChild(el("strong", {}, [word.charAt(0)]));
      frag.appendChild(document.createTextNode(word.slice(1)));
    });
    return frag;
  }

  // RECRUITERS is stored "Lastname RANK" (alphabetizes cleanly by surname in
  // the dropdown); results display it rank-first, e.g. "Shirley SFC" -> "SFC
  // Shirley".
  function formatRecruiterDisplay(value) {
    if (!value) return value;
    var parts = value.trim().split(/\s+/);
    if (parts.length < 2) return value;
    var rank = parts[parts.length - 1];
    var name = parts.slice(0, -1).join(" ");
    return rank + " " + name;
  }

  // First+Last stored separately (state.lastName/state.firstName) so the
  // Sheet/cookie history can sort and group by last name -- this is just
  // the "First Last" form used for on-screen greetings.
  function displayName() {
    return (state.firstName + " " + state.lastName).trim();
  }

  // ---------- Data loading ----------
  // Standalone single-file builds (see build_standalone.py) embed the data
  // directly as window.__EST_STANDALONE__ so there's no fetch() -- needed
  // because a file:// page can't reliably fetch sibling files in every
  // browser. The server-backed build (static/ + server.py) has no such
  // global, so it falls through to the normal fetch path unchanged.
  function loadData(cb) {
    if (window.__EST_STANDALONE__) {
      TEST_VARIANTS = window.__EST_STANDALONE__.testVariants;
      QUESTIONS = TEST_VARIANTS[0]; // Test 1 by default; re-picked in the startBtn handler
      SCORING = window.__EST_STANDALONE__.scoring;
      cb();
      return;
    }
    Promise.all([
      fetch("data/questions.json").then(function (r) { return r.json(); }),
      fetch("data/scoring_tables.json").then(function (r) { return r.json(); })
    ]).then(function (res) {
      QUESTIONS = res[0];
      SCORING = res[1];
      cb();
    });
  }

  // ---------- Screen: Start ----------
  function renderStart() {
    clear(app);
    setKeyHandler(null);
    disarmIdleTimeout();
    var card = el("div", { class: "card" });
    card.appendChild(el("h1", {}, ["PRACTICE ASVAB"]));
    card.appendChild(el("h2", { class: "subtitle" }, ["Practice test for the Armed Services Vocational Aptitude Battery"]));
    card.appendChild(el("div", { class: "instructions-box" }, [
      "The following test which you are about to take is a practice test for the Armed Services Vocational Aptitude " +
      "Battery (ASVAB). This practice test is a tool designed to gauge where your current academic capabilities are " +
      "at by using four testing categories. Each category has a set number of questions and a set amount of allotted " +
      "time in which to complete the section."
    ]));

    var sectionList = el("div", { class: "section-list" });
    QUESTIONS.sections.forEach(function (sec) {
      var parsed = parseSectionTitle(sec.title);
      sectionList.appendChild(el("div", { class: "section-item" }, [
        el("div", { class: "section-item-name" }, [boldedName(parsed.name)]),
        el("div", { class: "section-item-meta" }, [
          sec.questions.length + " questions  ·  " + sec.minutes + " minutes"
        ])
      ]));
    });
    card.appendChild(sectionList);

    card.appendChild(el("div", { class: "instructions-box" }, [
      "Take all instruction from your recruiter. Scratch paper should be available for any math functions " +
      "you need to complete for this test. Good luck!"
    ]));

    card.appendChild(el("label", { class: "field-label" }, ["Last Name: *"]));
    var lastNameInput = el("input", { type: "text", id: "lastName", placeholder: "Last name", required: "required" });
    card.appendChild(lastNameInput);
    var lastNameError = el("div", { class: "field-error" }, ["Last name is required."]);
    card.appendChild(lastNameError);

    card.appendChild(el("label", { class: "field-label" }, ["First Name:"]));
    var firstNameInput = el("input", { type: "text", id: "firstName", placeholder: "First name" });
    card.appendChild(firstNameInput);

    card.appendChild(el("label", { class: "field-label" }, ["Phone Number:"]));
    var phoneInput = el("input", { type: "tel", id: "phone", placeholder: "Phone number" });
    card.appendChild(phoneInput);

    card.appendChild(el("label", { class: "field-label" }, ["Recruiter: *"]));
    var recruiterSelect = el("select", { id: "recruiterSelect" });
    recruiterSelect.appendChild(el("option", { value: "", disabled: "disabled", selected: "selected" }, ["Select Recruiter"]));
    RECRUITERS.forEach(function (r) {
      recruiterSelect.appendChild(el("option", { value: r }, [r]));
    });
    card.appendChild(recruiterSelect);
    var recruiterError = el("div", { class: "field-error" }, ["Recruiter is required."]);
    card.appendChild(recruiterError);

    // Only shown once more than one variant exists -- a single-option
    // dropdown would just be clutter. Always defaults to Test 1.
    var testNumberSelect = null;
    if (TEST_VARIANTS.length > 1) {
      card.appendChild(el("label", { class: "field-label" }, ["Test Number:"]));
      testNumberSelect = el("select", { id: "testNumberSelect" });
      TEST_VARIANTS.forEach(function (v, i) {
        testNumberSelect.appendChild(el("option", { value: String(i + 1) }, ["Test " + (i + 1)]));
      });
      card.appendChild(testNumberSelect);
    }

    var startBtn = el("button", { class: "btn" }, ["Start Test"]);
    startBtn.addEventListener("click", function () {
      var last = lastNameInput.value.trim();
      if (!last) {
        lastNameInput.classList.add("input-error");
        lastNameError.classList.add("visible");
        lastNameInput.focus();
        return;
      }
      lastNameInput.classList.remove("input-error");
      lastNameError.classList.remove("visible");

      var first = firstNameInput.value.trim();
      var recruiter = recruiterSelect.value;

      // Name/recruiter fields double as the scores-viewer entry point: typing
      // last="check", first="scores" opens the saved-results screen instead
      // of starting a test, scoped to whichever recruiter is selected --
      // this runs before the recruiter-required check below, so leaving the
      // dropdown blank here still means "every recruiter" in that screen.
      if (last.toLowerCase() === SCORES_ACCESS_LAST && first.toLowerCase() === SCORES_ACCESS_FIRST) {
        renderScoresScreen(recruiter);
        return;
      }

      if (!recruiter) {
        recruiterSelect.classList.add("input-error");
        recruiterError.classList.add("visible");
        recruiterSelect.focus();
        return;
      }
      recruiterSelect.classList.remove("input-error");
      recruiterError.classList.remove("visible");

      var testNumber = testNumberSelect ? parseInt(testNumberSelect.value, 10) : 1;
      QUESTIONS = TEST_VARIANTS[testNumber - 1];

      state.lastName = last;
      state.firstName = first;
      state.phone = phoneInput.value.trim();
      state.recruiter = recruiter;
      state.testNumber = testNumber;
      state.sectionIndex = 0;
      state.answers = {};
      state.finalResults = null;
      state.finalPayload = null;
      QUESTIONS.sections.forEach(function (s) { state.answers[s.code] = {}; });
      renderPreTestHandoff();
    });
    card.appendChild(el("div", { class: "btn-row" }, [startBtn]));

    app.appendChild(card);
  }

  // ---------- Screen: Test section (one question at a time) ----------
  function startSection(idx) {
    state.sectionIndex = idx;
    state.questionIndex = 0;
    var sec = QUESTIONS.sections[idx];
    state.secondsLeft = sec.minutes * 60;
    renderQuestionScreen(sec);
    if (state.timerHandle) clearInterval(state.timerHandle);
    state.timerHandle = setInterval(function () { tick(sec); }, 1000);
  }

  function tick(sec) {
    state.secondsLeft -= 1;
    var timerEl = document.getElementById("timerDisplay");
    if (timerEl) {
      timerEl.textContent = fmtTime(Math.max(0, state.secondsLeft));
      timerEl.classList.toggle("low", state.secondsLeft <= 30);
    }
    if (state.secondsLeft <= 0) {
      clearInterval(state.timerHandle);
      finishSection(sec, true);
    }
  }

  function goToQuestion(sec, idx) {
    state.questionIndex = idx;
    renderQuestionScreen(sec);
  }

  function renderQuestionScreen(sec) {
    clear(app);
    disarmIdleTimeout();

    var total = sec.questions.length;
    var qIdx = state.questionIndex;
    var q = sec.questions[qIdx];
    var isLastQuestion = qIdx === total - 1;
    var remaining = total - qIdx - 1;

    // Sticky topbar: progress (left, grows) + timer (right, fixed width).
    // Stacks vertically on narrow/mobile screens via CSS, sits in one row on desktop.
    var topbar = el("div", { class: "test-topbar" });
    var topbarInner = el("div", { class: "topbar-inner" });

    var progressWrap = el("div", { class: "progress-wrap" });
    progressWrap.appendChild(el("div", { class: "progress-count" }, [
      "Question " + (qIdx + 1) + " of " + total,
      el("span", { class: "progress-remaining" }, [
        remaining > 0 ? (remaining + " left") : "last question"
      ])
    ]));
    var barOuter = el("div", { class: "progress-bar-outer" });
    barOuter.appendChild(el("div", {
      class: "progress-bar-inner",
      style: "width:" + Math.round(((qIdx + 1) / total) * 100) + "%"
    }));
    progressWrap.appendChild(barOuter);
    topbarInner.appendChild(progressWrap);

    topbarInner.appendChild(el("div", { class: "timer", id: "timerDisplay" }, [fmtTime(state.secondsLeft)]));
    topbar.appendChild(topbarInner);
    app.appendChild(topbar);

    var parsedTitle = parseSectionTitle(sec.title);
    var card = el("div", { class: "card test-card" });
    card.appendChild(el("div", { class: "section-header" }, [
      parsedTitle.part + " - ",
      boldedName(parsedTitle.name),
      " - You will have " + sec.minutes + " Minutes"
    ]));

    var answerError = el("div", { class: "field-error question-error" }, ["Please select an answer to continue."]);

    card.appendChild(renderQuestion(sec.code, q, function () {
      answerError.classList.remove("visible");
    }));

    // Forward-only: no way back to a previous question once answered. An
    // answer is required to advance -- clicking Next/Finish (or pressing
    // Enter, which triggers the same click) with nothing selected shows
    // answerError instead of moving on.
    var navRow = el("div", { class: "nav-row" });
    var nextBtn = el("button", { class: "btn" }, [isLastQuestion ? "Finish Section" : "Next →"]);
    nextBtn.addEventListener("click", function () {
      if (!state.answers[sec.code][q.n]) {
        answerError.classList.add("visible");
        return;
      }
      if (isLastQuestion) {
        clearInterval(state.timerHandle);
        finishSection(sec, false);
      } else {
        goToQuestion(sec, qIdx + 1);
      }
    });

    navRow.appendChild(nextBtn);
    card.appendChild(navRow);
    card.appendChild(answerError);

    app.appendChild(card);

    var numberToLetter = { "1": "A", "2": "B", "3": "C", "4": "D" };
    setKeyHandler(function (e) {
      // Proctor shortcut: Ctrl/Cmd+Enter selects the correct answer and
      // advances immediately, for quickly running through a full test.
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        e.preventDefault();
        state.answers[sec.code][q.n] = q.correct;
        nextBtn.click();
        return;
      }
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      var letter = numberToLetter[e.key] || (e.key.length === 1 ? e.key.toUpperCase() : "");
      if (letter === "A" || letter === "B" || letter === "C" || letter === "D") {
        var radio = document.getElementById(sec.code + "-" + q.n + "-" + letter);
        if (radio) {
          e.preventDefault();
          radio.click();
        }
        return;
      }
      if (e.key === "Enter") {
        e.preventDefault();
        nextBtn.click();
      }
    });
  }

  function renderQuestion(sectionCode, q, onAnswer) {
    var wrap = el("div", { class: "question question-single" });
    wrap.appendChild(el("div", { class: "q-prompt" }, [
      el("span", { class: "q-num" }, [q.n + "."]),
      q.prompt
    ]));

    var list = el("div", { class: "choice-list" });
    ["A", "B", "C", "D"].forEach(function (letter) {
      if (!q.choices[letter]) return;
      var inputId = sectionCode + "-" + q.n + "-" + letter;
      var radio = el("input", {
        type: "radio",
        name: sectionCode + "-" + q.n,
        id: inputId,
        value: letter
      });
      if (state.answers[sectionCode][q.n] === letter) radio.checked = true;
      radio.addEventListener("change", function () {
        state.answers[sectionCode][q.n] = letter;
        Array.prototype.forEach.call(list.querySelectorAll(".choice"), function (c) {
          c.classList.remove("selected");
        });
        choiceRow.classList.add("selected");
        if (onAnswer) onAnswer();
      });
      var choiceRow = el("label", {
        class: "choice" + (state.answers[sectionCode][q.n] === letter ? " selected" : ""),
        for: inputId
      }, [
        radio,
        el("span", { class: "choice-letter" }, [letter + ")"]),
        el("span", {}, [q.choices[letter]])
      ]);
      list.appendChild(choiceRow);
    });
    wrap.appendChild(list);
    return wrap;
  }

  function finishSection(sec, timedOut) {
    // Score and save to the local history the instant the last section ends
    // -- not when someone later clicks through to the results screen -- so
    // an accidental refresh on the STOP screen can't lose the result.
    var isLast = state.sectionIndex >= QUESTIONS.sections.length - 1;
    if (isLast) {
      state.finalResults = computeResults();
      state.finalPayload = buildResultPayload(state.finalResults);
      saveResultToHistory(state.finalPayload);
    }
    renderStop(sec, timedOut);
  }

  // ---------- Scoring ----------
  function vlookupApprox(lookupValue, table, keyIdx, valIdx) {
    var result = null;
    for (var i = 0; i < table.length; i++) {
      var row = table[i];
      var key = row[keyIdx];
      var val = row[valIdx];
      if (key === null || val === null) continue;
      if (key <= lookupValue) result = val;
      else break;
    }
    return result;
  }

  function scoreSection(sec) {
    var total = sec.questions.length;
    var correct = 0;
    var unanswered = 0;
    sec.questions.forEach(function (q) {
      var ans = state.answers[sec.code][q.n];
      if (!ans) unanswered++;
      else if (ans === q.correct) correct++;
    });
    return { total: total, correct: correct, unanswered: unanswered, pct: (100 * correct / total) };
  }

  function computeResults() {
    var byCode = {};
    QUESTIONS.sections.forEach(function (sec) { byCode[sec.code] = scoreSection(sec); });

    var rawTable = SCORING.raw_table; // [raw, ve_std, ar_std, mk_std]

    // The raw->standard table's own range (VE to 52, AR to 30, MK to 26) is the
    // REAL full-length ASVAB's question count -- exactly double this practice
    // test's (VE 26, AR 15, MK 13). A perfect practice score should therefore
    // land at the table's top row, not its midpoint, so each raw count is
    // doubled before the lookup. See README: "AFQT scaling fix."
    var rawVE = (byCode.WK.correct + byCode.PC.correct) * 2;
    var veStdBase = vlookupApprox(rawVE, rawTable, 0, 1) || 0;
    var veScore = veStdBase * 2;

    var arScore = vlookupApprox(byCode.AR.correct * 2, rawTable, 0, 2) || 0;
    var mkScore = vlookupApprox(byCode.MK.correct * 2, rawTable, 0, 3) || 0;

    var stdSum = veScore + arScore + mkScore;
    var aqft = vlookupApprox(stdSum, SCORING.pct_table, 0, 1);
    if (aqft === null) aqft = 99;

    var overallCorrect = 0, overallTotal = 0;
    Object.keys(byCode).forEach(function (code) {
      overallCorrect += byCode[code].correct;
      overallTotal += byCode[code].total;
    });
    var overallPct = 100 * overallCorrect / overallTotal;

    return {
      byCode: byCode, rawVE: rawVE, veScore: veScore, arScore: arScore, mkScore: mkScore,
      stdSum: stdSum, aqft: aqft, overallCorrect: overallCorrect, overallTotal: overallTotal, overallPct: overallPct
    };
  }

  // Section % correct -> a status band. This colors the per-section meters
  // (which read 0-100% and are honest to band by color). The AFQT hero
  // number deliberately does NOT get this treatment -- it's a percentile
  // projected through the (rescaled) full-length-ASVAB norm tables, not a
  // raw 0-100% score (see README). Banding it red/green would misrepresent
  // it as a pass/fail cutoff it was never designed to be.
  function statusBand(pct) {
    if (pct >= 70) return { key: "good", label: "Strong" };
    if (pct >= 40) return { key: "warning", label: "Needs review" };
    return { key: "critical", label: "Keep practicing" };
  }

  // ---------- Local result history (cookie) ----------
  // Every completed test is appended to a capped JSON array kept in a cookie
  // on this browser/device -- a durable local record of name, recruiter, and
  // scores that survives even when there's no server to POST to (see the
  // standalone note in loadData above). This runs for BOTH builds: it's a
  // local backup alongside the server save for the server-backed build, and
  // the only persistence at all for a bare file:// standalone build.
  var RESULTS_COOKIE = "est_results_history";
  var RESULTS_COOKIE_MAX_ENTRIES = 25;
  var RESULTS_COOKIE_MAX_DAYS = 365;
  var RESULTS_COOKIE_MAX_BYTES = 3800; // stay under the ~4KB per-cookie ceiling

  function setCookie(name, value, days) {
    var expires = "";
    if (days) {
      var date = new Date();
      date.setTime(date.getTime() + days * 24 * 60 * 60 * 1000);
      expires = "; expires=" + date.toUTCString();
    }
    document.cookie = name + "=" + encodeURIComponent(value) + expires + "; path=/; SameSite=Lax";
  }

  function getCookie(name) {
    var prefix = name + "=";
    var parts = document.cookie.split(";");
    for (var i = 0; i < parts.length; i++) {
      var part = parts[i].replace(/^\s+/, "");
      if (part.indexOf(prefix) === 0) return decodeURIComponent(part.slice(prefix.length));
    }
    return null;
  }

  function getResultsHistory() {
    var raw = getCookie(RESULTS_COOKIE);
    if (!raw) return [];
    try {
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }

  function saveResultToHistory(entry) {
    var history = getResultsHistory();
    history.push(entry);
    while (history.length > RESULTS_COOKIE_MAX_ENTRIES) history.shift();
    var serialized = JSON.stringify(history);
    // Belt-and-suspenders: keep dropping the oldest entry if we're still
    // near the cookie size ceiling (e.g. unusually long names).
    while (serialized.length > RESULTS_COOKIE_MAX_BYTES && history.length > 1) {
      history.shift();
      serialized = JSON.stringify(history);
    }
    setCookie(RESULTS_COOKIE, serialized, RESULTS_COOKIE_MAX_DAYS);
  }

  // Results that failed to sync to the webhook (offline, or the server
  // errored) are queued here and retried automatically -- on the browser's
  // "online" event, on a periodic safety-net interval (in case "online"
  // doesn't fire reliably on flaky/captive-portal-style connections), and
  // once at boot in case the kiosk was closed while still offline. Survives
  // across reloads/restarts for the same reason RESULTS_COOKIE does: a
  // kiosk can sit disconnected for a long stretch and needs to catch up
  // whenever it eventually reconnects, not just within the current session.
  var PENDING_SYNC_COOKIE = "est_pending_sync";
  var PENDING_SYNC_MAX_ENTRIES = 25;
  var PENDING_SYNC_MAX_DAYS = 365;
  var PENDING_SYNC_MAX_BYTES = 3800;
  var PENDING_SYNC_RETRY_MS = 2 * 60 * 1000;

  function getPendingSyncQueue() {
    var raw = getCookie(PENDING_SYNC_COOKIE);
    if (!raw) return [];
    try {
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }

  function savePendingSyncQueue(queue) {
    while (queue.length > PENDING_SYNC_MAX_ENTRIES) queue.shift();
    var serialized = JSON.stringify(queue);
    while (serialized.length > PENDING_SYNC_MAX_BYTES && queue.length > 1) {
      queue.shift();
      serialized = JSON.stringify(queue);
    }
    setCookie(PENDING_SYNC_COOKIE, serialized, PENDING_SYNC_MAX_DAYS);
  }

  function enqueuePendingSync(payload) {
    var queue = getPendingSyncQueue();
    queue.push(payload);
    savePendingSyncQueue(queue);
  }

  // Best-effort background catch-up -- not tied to any on-screen status
  // element, since the STOP screen that originally reported the failure
  // may be long gone by the time connectivity returns. Silent on success;
  // whatever's still unsent stays queued for the next attempt.
  function flushPendingSyncQueue() {
    if (!RESULTS_WEBHOOK_URL) return;
    var queue = getPendingSyncQueue();
    if (!queue.length) return;

    var stillPending = [];
    var remaining = queue.length;
    queue.forEach(function (payload) {
      fetch(RESULTS_WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      }).then(function (r) { return r.json(); }).then(function (res) {
        if (!res || !res.ok) stillPending.push(payload);
      }).catch(function () {
        stillPending.push(payload);
      }).then(function () {
        remaining--;
        if (remaining === 0) savePendingSyncQueue(stillPending);
      });
    });
  }

  // Shared shape for both the cookie history entry and the server POST body.
  function buildResultPayload(results) {
    var payload = {
      last_name: state.lastName,
      first_name: state.firstName,
      phone: state.phone,
      recruiter: state.recruiter,
      test_number: state.testNumber,
      timestamp: new Date().toISOString(),
      sections: {},
      ve_score: results.veScore,
      ar_score: results.arScore,
      mk_score: results.mkScore,
      std_sum: results.stdSum,
      afqt: results.aqft
    };
    Object.keys(results.byCode).forEach(function (code) {
      var r = results.byCode[code];
      payload.sections[code] = { correct: r.correct, total: r.total, unanswered: r.unanswered };
    });
    return payload;
  }

  // Sent as text/plain (not application/json) so the browser treats it as a
  // "simple request" and skips the CORS preflight -- Apps Script's web app
  // endpoint issues a redirect for POST requests that a preflight can choke
  // on. results-webhook.gs parses the body as JSON regardless of the header.
  //
  // Silent, like flushPendingSyncQueue -- the local cookie history is
  // already the durable record by the time this runs (see finishSection),
  // and the STOP screen's job is just "hand the device back", not narrate
  // sync plumbing. A failure here enqueues for automatic retry rather than
  // surfacing anything on screen.
  function postResultsToWebhook(payload) {
    if (!RESULTS_WEBHOOK_URL) return;
    fetch(RESULTS_WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (!res || !res.ok) enqueuePendingSync(payload);
    }).catch(function () {
      enqueuePendingSync(payload);
    });
  }

  // ---------- Recruiter next-action note (final STOP screen only) ----------
  // Unlike the main results sync, this is an interactive, in-the-moment
  // recruiter action -- so unlike postResultsToWebhook it reports success
  // and failure on screen rather than failing silently into the retry
  // queue, and it guards against a hung request (observed empirically
  // against this same webhook during testing) with a client-side timeout
  // so "Saving..." can't be left on screen forever with no feedback.
  function renderRecruiterNoteForm() {
    var wrap = el("div", { class: "note-form" });
    wrap.appendChild(el("label", { class: "field-label" }, ["Next Action (optional):"]));

    var select = el("select", { id: "nextActionSelect" });
    select.appendChild(el("option", { value: "" }, ["-- Select --"]));
    NEXT_ACTION_OPTIONS.forEach(function (opt) {
      select.appendChild(el("option", { value: opt }, [opt]));
    });
    wrap.appendChild(select);

    var otherWrap = el("div", { style: "display:none;margin-top:12px;" });
    otherWrap.appendChild(el("label", { class: "field-label" }, ["Plan / notes:"]));
    var otherInput = el("textarea", { id: "nextActionText", rows: "3", placeholder: "Describe the plan..." });
    otherWrap.appendChild(otherInput);
    wrap.appendChild(otherWrap);

    select.addEventListener("change", function () {
      otherWrap.style.display = select.value === NEXT_ACTION_OTHER ? "block" : "none";
    });

    var statusEl = el("span", { class: "note-status" }, [""]);
    var saveBtn = el("button", { class: "btn" }, ["Save Note"]);
    saveBtn.addEventListener("click", function () {
      saveRecruiterNote(select.value, otherInput.value.trim(), statusEl, saveBtn);
    });
    wrap.appendChild(el("div", { class: "note-save-row" }, [saveBtn, statusEl]));

    return wrap;
  }

  // Shown on the Results screen so the test-taker can scan/tap through to a
  // free March2Success account (M2S has no bulk/roster enrollment -- see
  // M2S_SIGNUP_URL comment). Opens in a new tab/window so the kiosk's own
  // state is never left mid-flow.
  function renderM2SCard() {
    var wrap = el("div", { class: "m2s-card" });
    wrap.appendChild(el("div", { class: "m2s-title" }, ["Keep practicing -- it's free"]));
    wrap.appendChild(el("div", { class: "m2s-blurb" }, [
      "Scan the code or tap below to create a free March2Success account."
    ]));
    wrap.appendChild(el("img", {
      class: "m2s-qr",
      src: "./assets/m2s_qr.png",
      alt: "QR code to sign up for March2Success"
    }));
    wrap.appendChild(el("div", { class: "m2s-link-row" }, [
      el("a", { class: "btn-outline", href: M2S_SIGNUP_URL, target: "_blank", rel: "noopener" }, [
        "Open March2Success"
      ])
    ]));

    return wrap;
  }

  function saveRecruiterNote(nextAction, otherText, statusEl, saveBtn) {
    // Blank is fine -- clicking Save with nothing chosen is a no-op, not
    // an error. Skipping the note entirely (never touching this form) is
    // equally fine, since it's never required to reach Continue to Results.
    if (!nextAction && !otherText) {
      statusEl.textContent = "Nothing to save.";
      return;
    }
    if (!RESULTS_WEBHOOK_URL || !state.finalPayload) {
      statusEl.textContent = "Notes aren't available right now.";
      return;
    }

    saveBtn.disabled = true;
    statusEl.textContent = "Saving...";

    var payload = {
      type: "note",
      result_timestamp: state.finalPayload.timestamp,
      last_name: state.lastName,
      first_name: state.firstName,
      recruiter: state.recruiter,
      next_action: nextAction,
      note_text: otherText
    };

    var hasAbort = "AbortController" in window;
    var controller = hasAbort ? new AbortController() : null;
    var timedOut = false;
    var timeoutId = hasAbort ? setTimeout(function () {
      timedOut = true;
      controller.abort();
    }, 10000) : null;

    fetch(RESULTS_WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
      signal: hasAbort ? controller.signal : undefined
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (timeoutId) clearTimeout(timeoutId);
      saveBtn.disabled = false;
      statusEl.textContent = (res && res.ok) ? "Note saved." : "Could not save note (server error). Try again.";
    }).catch(function () {
      if (timeoutId) clearTimeout(timeoutId);
      saveBtn.disabled = false;
      statusEl.textContent = timedOut
        ? "Could not save note (timed out). Try again."
        : "Could not save note (offline?). Try again.";
    });
  }

  // ---------- Screen: Saved scores viewer ----------
  // Entered via the SCORES_ACCESS_LAST/FIRST name combo on the start screen
  // (see startBtn handler). A blank recruiter (dropdown left untouched)
  // shows every recruiter's results; any specific recruiter value filters
  // to just theirs.
  function renderScoresScreen(recruiter) {
    clear(app);
    setKeyHandler(null);
    disarmIdleTimeout();

    var showAll = !recruiter;
    var entries = getResultsHistory().filter(function (e) {
      return showAll || e.recruiter === recruiter;
    });
    entries.sort(function (a, b) { return new Date(b.timestamp) - new Date(a.timestamp); });

    var card = el("div", { class: "card" });
    card.appendChild(el("h1", {}, ["Saved Scores"]));
    card.appendChild(el("p", { class: "byline" }, [
      showAll ? "All recruiters" : "Recruiter: " + formatRecruiterDisplay(recruiter)
    ]));
    card.appendChild(el("p", { class: "byline" }, [
      entries.length + (entries.length === 1 ? " result" : " results") + " saved on this device"
    ]));

    if (!entries.length) {
      card.appendChild(el("div", { class: "instructions-box" }, [
        "No saved scores yet" + (showAll ? "." : " for this recruiter.")
      ]));
    } else {
      // Section codes/order come from QUESTIONS itself (WK, AR, PC, MK) so
      // the table always matches whatever sections the test actually has.
      var sectionCodes = QUESTIONS.sections.map(function (sec) { return sec.code; });

      var tableWrap = el("div", { class: "scores-table-wrap" });
      var table = el("table", { class: "scores-table" });
      var showTestCol = TEST_VARIANTS.length > 1;
      var headerCells = [
        el("th", {}, ["Last Name"]),
        el("th", {}, ["First Name"]),
        el("th", {}, ["Phone"]),
        el("th", {}, ["Recruiter"]),
        el("th", {}, ["Date & Time"]),
        el("th", {}, ["AFQT"])
      ];
      if (showTestCol) headerCells.push(el("th", {}, ["Test"]));
      sectionCodes.forEach(function (code) {
        headerCells.push(el("th", {}, [code + " %"]));
      });
      table.appendChild(el("thead", {}, [el("tr", {}, headerCells)]));

      var tbody = el("tbody");
      entries.forEach(function (entry) {
        var parsedDate = new Date(entry.timestamp);
        var dateStr = isNaN(parsedDate.getTime()) ? (entry.timestamp || "—") : parsedDate.toLocaleString();
        var rowCells = [
          el("td", {}, [entry.last_name || "—"]),
          el("td", {}, [entry.first_name || "—"]),
          el("td", {}, [entry.phone || "—"]),
          el("td", {}, [formatRecruiterDisplay(entry.recruiter) || "—"]),
          el("td", {}, [dateStr]),
          el("td", { class: "scores-table-num" }, [String(entry.afqt)])
        ];
        if (showTestCol) {
          rowCells.push(el("td", { class: "scores-table-num" }, [String(entry.test_number || 1)]));
        }
        sectionCodes.forEach(function (code) {
          var sec = entry.sections && entry.sections[code];
          var pct = sec && sec.total ? Math.round((100 * sec.correct) / sec.total) + "%" : "—";
          rowCells.push(el("td", { class: "scores-table-num" }, [pct]));
        });
        tbody.appendChild(el("tr", {}, rowCells));
      });
      table.appendChild(tbody);
      tableWrap.appendChild(table);
      card.appendChild(tableWrap);
    }

    var backBtn = el("button", { class: "btn" }, ["Back"]);
    backBtn.addEventListener("click", function () { renderStart(); });
    card.appendChild(el("div", { class: "btn-row" }, [backBtn]));

    app.appendChild(card);
  }

  // ---------- Screen: Results ----------
  function renderResults() {
    clear(app);
    setKeyHandler(null);
    armIdleTimeout();
    // Already computed and saved to history in finishSection when the last
    // section ended, so a refresh on the STOP screen in between can't lose it.
    var results = state.finalResults;

    var card = el("div", { class: "card" });
    card.appendChild(el("h1", {}, ["Results"]));
    card.appendChild(el("p", { class: "byline" }, [displayName()]));
    card.appendChild(el("p", { class: "byline" }, [
      "Recruiter: " + formatRecruiterDisplay(state.recruiter) +
      (TEST_VARIANTS.length > 1 ? " · Test " + state.testNumber : "")
    ]));

    var hero = el("div", { class: "hero" });
    hero.appendChild(el("div", { class: "hero-value" }, [String(results.aqft)]));
    hero.appendChild(el("div", { class: "hero-label" }, ["Projected AFQT Score"]));
    hero.appendChild(el("div", { class: "hero-sub" }, [
      "Projected on the full-length ASVAB scale"
    ]));
    card.appendChild(hero);

    var meters = el("div", { class: "meter-list" });
    QUESTIONS.sections.forEach(function (sec) {
      var r = results.byCode[sec.code];
      var name = parseSectionTitle(sec.title).name;
      var band = statusBand(r.pct);

      var track = el("div", { class: "meter-track" });
      track.appendChild(el("div", {
        class: "meter-fill status-fill-" + band.key,
        style: "width:" + r.pct.toFixed(0) + "%"
      }));

      var footBits = [
        el("span", { class: "status-dot status-fill-" + band.key }),
        el("span", {}, [band.label])
      ];
      if (r.unanswered > 0) {
        footBits.push(el("span", { class: "meter-unanswered" }, [r.unanswered + " unanswered"]));
      }

      meters.appendChild(el("div", { class: "meter-row" }, [
        el("div", { class: "meter-head" }, [
          el("div", { class: "meter-name" }, [boldedName(name)]),
          el("div", { class: "meter-frac" }, [r.correct + " / " + r.total])
        ]),
        track,
        el("div", { class: "meter-foot" }, footBits)
      ]));
    });
    card.appendChild(meters);

    var overallStat = el("div", { class: "overall-stat" }, [
      el("div", { class: "overall-stat-value" }, [Math.round(results.overallPct) + "%"]),
      el("div", { class: "overall-stat-label" }, ["Overall"])
    ]);
    card.appendChild(overallStat);

    card.appendChild(renderM2SCard());

    var restartBtn = el("button", { class: "btn" }, ["Start New Test"]);
    restartBtn.addEventListener("click", function () {
      renderStart();
    });
    card.appendChild(el("div", { class: "btn-row" }, [restartBtn]));

    app.appendChild(card);
  }

  // ---------- Boot ----------
  loadData(renderStart);

  // This is used as a home-screen app on an iPad -- an edge-swipe "back"
  // gesture (or a stray back button) would otherwise navigate away from
  // the SPA entirely, losing all in-progress test state. There's nothing
  // to go "back" to within this single-page app, so every back attempt is
  // absorbed: a history entry is pushed immediately, and popstate re-pushes
  // one every time, so the trap never runs out and never needs a second
  // back-press to exit (which would just leave the tab open with the old
  // screen still rendered -- exactly what an unattended kiosk needs).
  history.pushState(null, "", location.href);
  window.addEventListener("popstate", function () {
    history.pushState(null, "", location.href);
  });

  // Catch up any results that failed to sync in a previous session (kiosk
  // closed/reloaded while still offline), whenever connectivity returns,
  // and periodically as a safety net in case the "online" event doesn't
  // fire reliably on every network transition.
  if (navigator.onLine) flushPendingSyncQueue();
  window.addEventListener("online", flushPendingSyncQueue);
  setInterval(function () {
    if (navigator.onLine) flushPendingSyncQueue();
  }, PENDING_SYNC_RETRY_MS);
})();

</script>
<script>
  // Registered here (not just index.html) because manifest.json's start_url
  // points straight at this file -- Add to Home Screen launches directly
  // into this page, skipping the redirector entirely.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js").catch(function () {});
  }
</script>
</body>
</html>
